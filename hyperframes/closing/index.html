<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Closing — 6 Ikhtiar Kerajaan MADANI</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --accent: #e8501c;
        --ink: #ffffff;
        --paper: #f9dfb0;
        --font-display: "Poppins", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      .plate { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="closing" data-start="0" data-duration="8.9" data-width="1080" data-height="1920">
      <video id="cl-video" class="clip plate" src="assets/closing.mp4" data-start="0" data-duration="5.83"
        data-track-index="0" muted playsinline style="z-index: 1"></video>

      <div id="cl-behind" data-composition-id="cl-behind" data-composition-src="compositions/cl-behind.html"
        data-start="0" data-duration="5.83" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="position: absolute; inset: 0; z-index: 5"></div>

      <video id="cl-cut" class="clip plate" src="assets/cut_closing.webm" data-start="0" data-duration="5.83"
        data-track-index="2" muted playsinline data-layout-allow-occlusion style="z-index: 3"></video>

      <div id="cl-front" data-composition-id="cl-front" data-composition-src="compositions/cl-front.html"
        data-start="0" data-duration="5.83" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="position: absolute; inset: 0; z-index: 4"></div>

      <div id="cl-caps" data-composition-id="cl-caps" data-composition-src="compositions/cl-caps.html"
        data-start="0" data-duration="5.83" data-track-index="4" data-track-kind="captions"
        data-width="1080" data-height="1920" style="position: absolute; inset: 0; z-index: 5"></div>

      <div id="cl-end" data-composition-id="cl-end" data-composition-src="compositions/cl-end.html"
        data-start="5.6" data-duration="3.3" data-track-index="5" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="position: absolute; inset: 0; z-index: 6"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["closing"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
