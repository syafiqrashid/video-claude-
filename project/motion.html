<!doctype html>
<html><head><meta charset="utf-8"><title>Enam Ikhtiar Motion</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="854" height="480"></canvas>
<script>
// DATA is injected: window.DATA = {map:[[s,e,tn],...], dur, scenes:[...], lines:[...]}
const W = 854, H = 480;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = 'Inter, "Noto Color Emoji", sans-serif';
const EMO = '"Noto Color Emoji"';

// ---------- palette ----------
const C = {
  navy:'#0a1f5c', navy2:'#0d2f86', blue:'#1556d6', sky:'#3d8bff', cyan:'#57d2ff',
  red:'#d4161f', red2:'#ff3b3b', yellow:'#ffd21f', gold:'#ffb400', white:'#ffffff',
  ink:'#0b1d4d', grey:'#8a97b5', green:'#1fbf5b', paper:'#f4f7ff'
};

// ---------- time mapping (original VO time -> edited timeline) ----------
let MAP = [];
function M(t){
  const m = MAP; if (!m.length) return t;
  if (t <= m[0][0]) return Math.max(0, m[0][2] - (m[0][0]-t));
  for (let i=0;i<m.length;i++){
    const [s,e,tn] = m[i];
    if (t>=s && t<=e) return tn + (t-s);
    if (i+1<m.length && t>e && t<m[i+1][0]){
      const a = tn+(e-s), b = m[i+1][2];
      return a + (b-a)*((t-e)/(m[i+1][0]-e));
    }
  }
  const l = m[m.length-1]; return l[2]+(l[1]-l[0])+(t-l[1]);
}

// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=k=>1-Math.pow(1-clamp(k),3);
const eIO=k=>{k=clamp(k);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2};
const eBack=k=>{k=clamp(k);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const eElastic=k=>{k=clamp(k);if(k===0||k===1)return k;return Math.pow(2,-10*k)*Math.sin((k*10-.75)*(2*Math.PI/3))+1};
// progress of an appearance starting at original-time cue
let T=0; // current edited-timeline time
const at=(orig,dur=.5)=>clamp((T-M(orig))/dur);
const atN=(tn,dur=.5)=>clamp((T-tn)/dur);

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fillRR(x,y,w,h,r,fill,stroke,lw=2){rr(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function grad(x0,y0,x1,y1,stops){const g=ctx.createLinearGradient(x0,y0,x1,y1);stops.forEach((s,i)=>g.addColorStop(s[0],s[1]));return g;}
function shadow(b=12,c='rgba(0,0,0,.35)',oy=4){ctx.shadowBlur=b;ctx.shadowColor=c;ctx.shadowOffsetY=oy;ctx.shadowOffsetX=0;}
function noShadow(){ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.shadowOffsetY=0;}
function font(sz,wt=800){ctx.font=`${wt} ${sz}px ${FONT}`;}
function text(s,x,y,o={}){
  ctx.save();
  font(o.size||20,o.weight||800);
  ctx.textAlign=o.align||'left'; ctx.textBaseline=o.base||'alphabetic';
  if(o.italic){ctx.translate(x,y);ctx.transform(1,0,-0.18,1,0,0);x=0;y=0;}
  if(o.shadow){shadow(o.shadow, o.shadowColor||'rgba(0,0,20,.55)', 3);}
  if(o.stroke){ctx.lineJoin='round';ctx.lineWidth=o.stroke;ctx.strokeStyle=o.strokeColor||C.navy;ctx.strokeText(s,x,y);}
  ctx.fillStyle=o.color||C.white; ctx.fillText(s,x,y);
  ctx.restore();
}
function emoji(e,x,y,sz){ctx.save();ctx.font=`${sz}px ${EMO}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,x,y);ctx.restore();}
function wrap(s,maxW,sz,wt){font(sz,wt);const words=s.split(' ');const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;}
// scale/alpha transform around a point
function pushT(cx,cy,sc=1,alpha=1,rot=0){ctx.save();ctx.globalAlpha*=clamp(alpha);ctx.translate(cx,cy);if(rot)ctx.rotate(rot);ctx.scale(sc,sc);ctx.translate(-cx,-cy);}
function popT(){ctx.restore();}
function fmt(n){return Math.round(n).toLocaleString('en-US');}
// deterministic pseudo random
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}

// ---------- shared backgrounds ----------
function bgBlue(){
  ctx.fillStyle=grad(0,0,W,H,[[0,'#0a2a8a'],[.55,'#1250d0'],[1,'#0a2a8a']]); ctx.fillRect(0,0,W,H);
  // diagonal light streaks
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<6;i++){
    const x=((T*30+i*190)%(W+400))-200;
    ctx.fillStyle=`rgba(90,170,255,${.05+.03*rnd(i)})`;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+60,0);ctx.lineTo(x-140,H);ctx.lineTo(x-200,H);ctx.fill();
  }
  // floating particles
  for(let i=0;i<40;i++){
    const px=(rnd(i)*W+T*8*(0.5+rnd(i+9)))%W, py=(rnd(i+3)*H - T*12*(0.3+rnd(i+5))%H+H)%H;
    ctx.fillStyle=`rgba(180,220,255,${.25+.4*rnd(i+7)})`;ctx.beginPath();ctx.arc(px,py,1+1.6*rnd(i+1),0,7);ctx.fill();
  }
  ctx.restore();
}
function skyline(y,color,scale=1,seed=0){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);
  let x=0,i=seed;
  while(x<W){const w=(18+rnd(i)*34)*scale,h=(30+rnd(i+50)*90)*scale;ctx.lineTo(x,y-h);ctx.lineTo(x+w,y-h);x+=w+2;i++;}
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}
function twinTowers(x,y,s,color){
  ctx.fillStyle=color;
  for(const dx of [-22,22]){
    ctx.beginPath();const bx=x+dx*s;
    ctx.moveTo(bx-12*s,y);ctx.lineTo(bx-12*s,y-150*s);ctx.lineTo(bx-9*s,y-175*s);ctx.lineTo(bx-6*s,y-195*s);
    ctx.lineTo(bx-1.5*s,y-215*s);ctx.lineTo(bx,y-250*s);ctx.lineTo(bx+1.5*s,y-215*s);ctx.lineTo(bx+6*s,y-195*s);
    ctx.lineTo(bx+9*s,y-175*s);ctx.lineTo(bx+12*s,y-150*s);ctx.lineTo(bx+12*s,y);ctx.fill();
  }
  ctx.fillRect(x-12*s,y-118*s,24*s,5*s); // skybridge
}
function kltower(x,y,s,color){ctx.fillStyle=color;ctx.fillRect(x-3*s,y-150*s,6*s,150*s);
  ctx.beginPath();ctx.ellipse(x,y-150*s,13*s,9*s,0,0,7);ctx.fill();ctx.fillRect(x-1*s,y-195*s,2*s,45*s);}
function flagWave(x,y,w,h,t,alpha=1){
  // simplified Jalur Gemilang with wave
  ctx.save();ctx.globalAlpha*=alpha;
  const stripes=14, sh=h/stripes, cols=40;
  for(let s=0;s<stripes;s++){
    ctx.fillStyle=s%2===0?'#cc0001':'#ffffff';
    ctx.beginPath();
    for(let c=0;c<=cols;c++){const px=x+w*c/cols,off=Math.sin(c/cols*6+t*3)*h*.06*(c/cols);ctx.lineTo(px,y+s*sh+off);}
    for(let c=cols;c>=0;c--){const px=x+w*c/cols,off=Math.sin(c/cols*6+t*3)*h*.06*(c/cols);ctx.lineTo(px,y+(s+1)*sh+off+.5);}
    ctx.fill();
  }
  const cw=w*.5,ch=sh*8;ctx.fillStyle='#010066';ctx.fillRect(x,y,cw,ch);
  ctx.fillStyle='#fc0';ctx.beginPath();ctx.arc(x+cw*.36,y+ch*.5,ch*.34,0,7);ctx.fill();
  ctx.fillStyle='#010066';ctx.beginPath();ctx.arc(x+cw*.42,y+ch*.5,ch*.29,0,7);ctx.fill();
  // 14-point star
  ctx.fillStyle='#fc0';ctx.beginPath();const sx=x+cw*.68,sy=y+ch*.5,R=ch*.3,r=R*.45;
  for(let i=0;i<28;i++){const a=-Math.PI/2+i*Math.PI/14,rad=i%2?r:R;ctx.lineTo(sx+Math.cos(a)*rad,sy+Math.sin(a)*rad);}ctx.fill();
  ctx.restore();
}
function sweep(x,y,w,h,k){ // light sweep over a region, k 0..1
  if(k<=0||k>=1)return;ctx.save();rr(x,y,w,h,0);ctx.clip();
  const px=x-w*.3+(w*1.6)*k;
  ctx.fillStyle=grad(px-60,0,px+60,0,[[0,'rgba(255,255,255,0)'],[.5,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,0)']]);
  ctx.globalCompositeOperation='lighter';ctx.translate(px,y);ctx.transform(1,0,-.4,1,0,0);ctx.fillRect(-60,0,120,h);ctx.restore();
}

// ---------- layout chrome ----------
const VX=14,VY=50,VW=528,VH=378, PX=552,PY=50,PW=288,PH=378;
function header(sceneNo, title, a){
  ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle=grad(0,0,W,0,[[0,'rgba(5,20,70,.85)'],[1,'rgba(5,20,70,.55)']]);ctx.fillRect(0,0,W,40);
  ctx.fillStyle=C.yellow;ctx.fillRect(0,40,W,2);
  text('ENAM IKHTIAR',16,27,{size:18,weight:900,italic:true});
  font(18,900);const w1=ctx.measureText('ENAM IKHTIAR ').width;
  text('UNTUK RAKYAT',16+w1,27,{size:18,weight:900,italic:true,color:C.yellow});
  // ikhtiar progress chips
  const labels=['BUDI','SEKOLAH','AI','KESIHATAN','e-INVOIS','PENJAJA'];
  let x=W-14;
  for(let i=5;i>=0;i--){font(10,800);const w=ctx.measureText(labels[i]).width+18;x-=w;
    const active=sceneNo-2===i, done=sceneNo-2>i;
    fillRR(x,11,w,19,9.5,active?C.yellow:done?'rgba(255,255,255,.25)':'rgba(255,255,255,.08)',active?null:'rgba(255,255,255,.3)',1);
    text(labels[i],x+w/2,24.5,{size:10,weight:800,align:'center',color:active?C.navy:'#cfe0ff'});x-=6;}
  ctx.restore();
}
function sceneBadge(no,x,y,a){
  pushT(x+20,y+12,lerp(.6,1,eBack(a)),a);
  fillRR(x,y,40,24,6,C.yellow);text(String(no).padStart(2,'0'),x+20,y+18,{size:16,weight:900,align:'center',color:C.navy});
  popT();
}
function card(x,y,w,h){shadow(18,'rgba(0,10,40,.5)',6);fillRR(x,y,w,h,14,'#fff');noShadow();}

// ---------- script panel (replaces "Cadangan Motion") ----------
function linesOf(scene){return DATA.lines.filter(l=>l[2]===scene);}
function karaokeLine(l,x,y,maxW,sz,lh,colSpoken,colTodo,alpha=1){
  const s=M(l[0]), e=M(l[1]);
  const prog=clamp((T-s)/Math.max(.1,e-s));
  const lines=wrap(l[3],maxW,sz,700);
  const total=l[3].length; let done=prog*total, cnt=0;
  ctx.save();ctx.globalAlpha*=alpha;
  lines.forEach((ln,i)=>{
    font(sz,700);let cx=x;
    for(const w of ln.split(' ')){
      const wEnd=cnt+w.length; const spoken=done>=cnt+w.length*.4;
      ctx.fillStyle=spoken?colSpoken:colTodo; ctx.textBaseline='alphabetic';
      ctx.fillText(w,cx,y+i*lh); cx+=ctx.measureText(w+' ').width; cnt=wEnd+1;
    }
  });
  ctx.restore();
  return lines.length*lh;
}
function scriptPanel(sceneNo,title,a){
  const x=PX+lerp(60,0,eOut(a)), y=PY;
  ctx.save();ctx.globalAlpha=clamp(a);
  card(x,y,PW,PH);
  // header
  text(`BABAK ${sceneNo}`,x+16,y+28,{size:12,weight:800,color:C.blue});
  const tl=wrap(title,PW-32,19,900);
  tl.forEach((t,i)=>text(t,x+16,y+52+i*22,{size:19,weight:900,color:C.ink}));
  let yy=y+52+tl.length*22;
  fillRR(x+16,yy-4,74,22,6,C.red);text('SKRIP VO',x+53,yy+11.5,{size:11,weight:900,align:'center'});
  ctx.fillStyle='#e3e9f8';ctx.fillRect(x+98,yy+7,PW-114,2);
  yy+=50;
  // lines: past ones dim and small, current highlighted
  const ls=linesOf(sceneNo);
  let cur=0; ls.forEach((l,i)=>{if(T>=M(l[0])-.25)cur=i;});
  const bodyTop=yy, bodyBot=y+PH-14;
  ctx.save();rr(x+8,bodyTop-19,PW-16,bodyBot-bodyTop+19,6);ctx.clip();
  // measure heights to scroll current into view
  const hs=ls.map(l=>wrap(l[3],PW-44,14.5,700).length*20+14);
  const avail=bodyBot-bodyTop;
  const scrollFor=c=>{let j=0;const sum=(a,b)=>hs.slice(a,b+1).reduce((p,q)=>p+q,0);while(j<c&&sum(j,c)>avail)j++;return sum(0,j-1);};
  const k=eIO(clamp((T-M(ls[cur][0])+.25)/.5));
  let scroll=lerp(cur>0?scrollFor(cur-1):0,scrollFor(cur),k);
  let py=bodyTop-scroll;
  ls.forEach((l,i)=>{
    const started=T>=M(l[0])-.25; const ap=clamp((T-M(l[0])+.25)/.35);
    if(!started){py+=hs[i];return;}
    const isCur=i===cur;
    if(isCur){ctx.fillStyle=`rgba(21,86,214,${.08*ap})`;rr(x+12,py-16,PW-24,hs[i]-4,8);ctx.fill();
      ctx.fillStyle=C.yellow;ctx.fillRect(x+12,py-16,4,hs[i]-4);}
    karaokeLine(l,x+24,py,PW-44,14.5,20,isCur?C.ink:'#7d8aa8',isCur?'#b5bfd6':'#9aa6c0',ap);
    py+=hs[i];
  });
  ctx.restore();
  ctx.restore();
}
// lower-third caption for full-screen scenes
function caption(sceneNo,a=1){
  const ls=linesOf(sceneNo);let cur=-1;ls.forEach((l,i)=>{if(T>=M(l[0])-.2&&T<=M(l[1])+.6)cur=i;});
  if(cur<0)return;const l=ls[cur];
  const ap=clamp((T-M(l[0])+.2)/.3)*clamp((M(l[1])+.6-T)/.3)*a;
  const lines=wrap(l[3],640,17,700);const h=lines.length*24+20,w=680,x=(W-w)/2,y=H-h-22;
  ctx.save();ctx.globalAlpha=ap;shadow(14,'rgba(0,0,30,.5)',4);fillRR(x,y,w,h,12,'rgba(255,255,255,.95)');noShadow();
  ctx.fillStyle=C.red;rr(x,y,8,h,4);ctx.fill();
  karaokeLine(l,x+24,y+30,640,17,24,C.ink,'#aab4cc');ctx.restore();
}

// ---------- scene visuals ----------
function visualFrame(a, sky){
  const x=VX+lerp(-60,0,eOut(a));
  ctx.save();ctx.globalAlpha=clamp(a);shadow(18,'rgba(0,10,40,.5)',6);fillRR(x,VY,VW,VH,14,'#123');noShadow();
  rr(x,VY,VW,VH,14);ctx.clip();
  ctx.fillStyle=sky;ctx.fillRect(x,VY,VW,VH);
  return x;
}
function titleBlock(lines,x,y,a,opts={}){
  // lines: [{t,size,color,bg}]
  let yy=y;
  lines.forEach((l,i)=>{
    if(i>0) yy+=l.size+(lines[i-1].gap||8);
    const k=eBack(clamp((a-i*.12)/.5));
    pushT(x,yy,lerp(.4,1,k),k);
    if(l.bg){font(l.size,900);const w=ctx.measureText(l.t).width+24;ctx.save();ctx.translate(x,yy);ctx.transform(1,0,-.18,1,0,0);
      shadow(10,'rgba(0,0,0,.4)',3);fillRR(-6,-l.size-2,w,l.size+12,5,l.bg);noShadow();ctx.restore();
      text(l.t,x+6,yy,{size:l.size,weight:900,italic:true,color:l.color||C.white});}
    else text(l.t,x,yy,{size:l.size,weight:900,italic:true,color:l.color||C.white,stroke:l.stroke||6,strokeColor:l.sc||C.navy,shadow:8});
    popT();
  });
}
function statBox(x,y,w,h,a,draw,fill='#fff'){
  const k=eBack(a);if(a<=0)return;pushT(x+w/2,y+h/2,lerp(.5,1,k),clamp(a*2));
  shadow(12,'rgba(0,10,40,.45)',4);fillRR(x,y,w,h,10,fill);noShadow();draw(x,y,w,h);popT();
}
function arrowR(x,y,len,col,k=1){ctx.save();ctx.globalAlpha*=k;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+len*k-8,y);ctx.stroke();ctx.beginPath();ctx.moveTo(x+len*k,y);ctx.lineTo(x+len*k-12,y-8);ctx.lineTo(x+len*k-12,y+8);ctx.fill();ctx.restore();}

// ===== Scene 1: Pembukaan =====
function scene1(lt){
  const z=1+lt*.012;
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
  ctx.fillStyle=grad(0,0,0,H,[[0,'#2a4fb8'],[.45,'#7aa6ff'],[.7,'#ffc48a'],[1,'#ff9a5a']]);ctx.fillRect(-40,-40,W+80,H+80);
  // sun
  const sg=ctx.createRadialGradient(560,300,10,560,300,220);sg.addColorStop(0,'rgba(255,240,200,.95)');sg.addColorStop(1,'rgba(255,200,120,0)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
  skyline(370,'rgba(40,60,130,.55)',1,3);
  twinTowers(130,372,1.15,'rgba(25,40,100,.9)');kltower(250,372,1,'rgba(25,40,100,.85)');
  skyline(400,'rgba(20,32,85,.9)',.8,21);
  flagWave(-30,360,560,150,T,1);
  ctx.restore();
  // particles + light
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<30;i++){const px=(rnd(i)*W+T*15)%W,py=(rnd(i+2)*H-T*10*rnd(i+4)+H)%H;ctx.fillStyle=`rgba(255,240,200,${.3*rnd(i+5)})`;ctx.beginPath();ctx.arc(px,py,1.5,0,7);ctx.fill();}
  ctx.restore();
  const a=clamp((lt-1.0)/1.2);
  titleBlock([
    {t:'ENAM IKHTIAR',size:52,stroke:8,gap:14},
    {t:'UNTUK',size:26,bg:'#fff',color:C.navy,gap:12},
    {t:'RAKYAT',size:72,color:C.yellow,stroke:9,sc:'#a00010'}
  ],400,120,a);
  sweep(370,60,470,240,clamp((lt-2.4)/1.1));
  caption(1);
}
// ===== Scene 2: BUDI MADANI =====
function scene2(lt){
  const x=visualFrame(clamp(lt/.6),grad(0,VY,0,VY+VH,[[0,'#2b6de8'],[.6,'#8fc0ff'],[1,'#d9ecff']]));
  ctx.save();ctx.globalAlpha=.6;skyline(VY+300,'rgba(60,100,190,.6)',.7,40);ctx.restore();
  ctx.fillStyle='#5a6b80';ctx.fillRect(x,VY+300,VW,VH-300);ctx.fillStyle='#fff';
  for(let i=0;i<8;i++)ctx.fillRect(x+((i*80-T*60)%(VW+80)+VW+80)%(VW+80)-40,VY+338,40,4);
  // fuel nozzle
  const nk=eOut(clamp((lt-.3)/.8));
  ctx.save();ctx.translate(x+lerp(-120,0,nk),VY+40);
  ctx.strokeStyle='#222';ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-20,240);ctx.bezierCurveTo(40,200,10,120,60,80);ctx.stroke();
  ctx.fillStyle=C.red;fillRR(40,40,70,46,10,C.red);ctx.fillStyle='#ddd';ctx.fillRect(100,52,60,12);ctx.fillStyle='#333';ctx.fillRect(56,84,30,20);
  // drop
  const dp=(lt*0.7)%1;ctx.fillStyle=C.yellow;ctx.beginPath();ctx.arc(160,64+dp*60,5,0,7);ctx.fill();
  ctx.restore();
  text('BUDI MADANI',x+VW/2+40,VY+48,{size:40,weight:900,italic:true,align:'center',stroke:7,strokeColor:C.navy,shadow:8,color:'#fff'});
  // vehicles drive in
  const vk=eOut(at(25.0,1.2));
  emoji('🛻',x+lerp(VW+80,200,vk),VY+300,74);
  emoji('🚙',x+lerp(VW+200,330,eOut(at(26.2,1.2))),VY+302,70);
  // BUDI95 box with counter 200 -> 300
  statBox(x+150,VY+78,170,92,at(17.2,.6),(bx,by,bw,bh)=>{
    text('BUDI95',bx+bw/2,by+24,{size:17,weight:900,align:'center',color:C.ink});
    const v=Math.round(lerp(200,300,eIO(at(20.3,.9))));
    text(`${v} L`,bx+bw/2,by+62,{size:34,weight:900,align:'center',color:C.red});
    text('sebulan',bx+bw/2,by+82,{size:11,weight:700,align:'center',color:C.grey});
    if(at(20.3)<1&&at(19.3)>0)text('200 L →',bx+bw/2,by+40,{size:11,weight:800,align:'center',color:C.grey});
  });

const SCENES={1:scene1,2:scene2,3:scene3,4:scene4,5:scene5,6:scene6,7:scene7,8:scene8};
function drawScene(id,t0){
  const lt=T-t0;
  if(id===1||id===8){SCENES[id](lt);return;}
  bgBlue();
  const sc=DATA.scenes.find(s=>s.id===id);
  header(id,sc.title,1);
  SCENES[id](lt);
  scriptPanel(id,`${sc.title}`,clamp((lt-.15)/.6));
}
window.drawFrame=function(t){
  T=t;ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);
  const sc=DATA.scenes.map(s=>({...s,t0:M(s.start)}));
  let i=0;for(let k=0;k<sc.length;k++)if(t>=sc[k].t0)i=k;
  const cur=sc[i];
  const TR=.6;
  drawScene(cur.id,cur.t0);
  // transition: previous scene wipes out with a diagonal light bar
  if(i>0&&t-cur.t0<TR){
    const k=eIO((t-cur.t0)/TR);
    ctx.save();ctx.beginPath();const xx=W*1.3*k;ctx.moveTo(xx,0);ctx.lineTo(W+200,0);ctx.lineTo(W+200,H);ctx.lineTo(xx-200,H);ctx.closePath();ctx.clip();
    drawScene(sc[i-1].id,sc[i-1].t0);ctx.restore();
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=grad(xx-80,0,xx+20,0,[[0,'rgba(255,210,31,0)'],[.7,'rgba(255,210,31,.85)'],[1,'rgba(255,255,255,0)']]);
    ctx.beginPath();ctx.moveTo(xx-60,0);ctx.lineTo(xx+10,0);ctx.lineTo(xx-190,H);ctx.lineTo(xx-260,H);ctx.fill();ctx.restore();
  }
  // global fade-in
  if(t<.6){ctx.fillStyle=`rgba(0,0,0,${1-t/.6})`;ctx.fillRect(0,0,W,H);}
};
window.init=function(d){window.DATA=d;MAP=d.map;};
window.framesJPEG=function(t0,n,fps){const out=[];for(let i=0;i<n;i++){drawFrame(t0+i/fps);out.push(cv.toDataURL('image/jpeg',.92));}return out;};
