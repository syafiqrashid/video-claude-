<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --navy: #0a2342;
        --navy-90: rgba(10, 35, 66, 0.9);
        --gold: #ffc629;
        --red: #d7263d;
        --ink: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Montserrat, sans-serif;
        color: var(--ink);
      }
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 40%;
      }
      .vid {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        transform-origin: 50% 38%;
      }
      .shade {
        position: absolute;
        left: 0;
        width: 100%;
        pointer-events: none;
        z-index: 5;
      }
      #shade-top {
        top: 0;
        height: 620px;
        background: linear-gradient(180deg, rgba(4, 14, 30, 0.72) 0%, rgba(4, 14, 30, 0) 100%);
      }
      #shade-bot {
        bottom: 0;
        height: 820px;
        background: linear-gradient(0deg, rgba(4, 14, 30, 0.78) 0%, rgba(4, 14, 30, 0) 100%);
      }
      .layer {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      /* ---------- progress + section badge ---------- */
      #progress {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 86px;
        height: 12px;
        display: flex;
        gap: 10px;
        opacity: 0;
      }
      .pseg {
        flex: 1;
        height: 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.28);
        overflow: hidden;
      }
      .pfill {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--gold);
        transform-origin: 0 50%;
        transform: scaleX(0);
      }
      .badge {
        position: absolute;
        left: 70px;
        top: 134px;
        display: flex;
        align-items: stretch;
        opacity: 0;
        max-width: 940px;
      }
      .badge .num {
        background: var(--gold);
        color: var(--navy);
        font-weight: 900;
        font-size: 64px;
        line-height: 1;
        padding: 20px 24px 16px;
        border-radius: 18px 0 0 18px;
        letter-spacing: -0.03em;
      }
      .badge .txt {
        background: var(--navy-90);
        padding: 14px 30px 14px 26px;
        border-radius: 0 18px 18px 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .badge .title {
        font-weight: 900;
        font-size: 44px;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }
      .badge .sub {
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 24px;
        color: var(--gold);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-top: 4px;
      }

      /* ---------- number callout ---------- */
      .callout {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 300px;
        display: flex;
        justify-content: center;
        opacity: 0;
      }
      .callout .card {
        background: var(--navy-90);
        border-left: 14px solid var(--gold);
        border-radius: 22px;
        padding: 22px 40px 26px;
        text-align: center;
        max-width: 940px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      .callout .k {
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 28px;
        color: var(--gold);
        letter-spacing: 0.08em;
      }
      .callout .b {
        display: block;
        font-weight: 900;
        font-size: 132px;
        line-height: 1;
        letter-spacing: -0.04em;
        margin: 8px 0 6px;
      }
      .callout .f {
        font-weight: 700;
        font-size: 34px;
        color: rgba(255, 255, 255, 0.86);
      }
      .callout .was {
        font-weight: 700;
        font-size: 34px;
        color: rgba(255, 255, 255, 0.86);
      }

      /* ---------- chips ---------- */
      #chips {
        position: absolute;
        left: 0;
        right: 0;
        top: 1120px;
        display: flex;
        justify-content: center;
        gap: 18px;
      }
      .chip {
        display: block;
        background: var(--gold);
        color: var(--navy);
        font-weight: 900;
        font-size: 46px;
        padding: 12px 30px;
        border-radius: 999px;
        opacity: 0;
      }

      /* ---------- hook ---------- */
      #hook-flash {
        position: absolute;
        left: 0;
        right: 0;
        top: 230px;
        height: 260px;
      }
      .hf {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 170px;
        letter-spacing: -0.05em;
        color: var(--gold);
        text-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        opacity: 0;
      }
      #hook-title {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 170px;
        text-align: center;
        opacity: 0;
      }
      #hook-title .eyebrow {
        display: inline-block;
        background: var(--red);
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.1em;
        padding: 8px 22px;
        border-radius: 10px;
      }
      #hook-title .big {
        display: block;
        font-weight: 900;
        font-size: 124px;
        line-height: 0.95;
        letter-spacing: -0.05em;
        margin-top: 18px;
        color: var(--gold);
        text-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      }
      #hook-title .small {
        display: block;
        font-weight: 900;
        font-size: 58px;
        letter-spacing: -0.02em;
        margin-top: 14px;
      }

      /* ---------- "6 inisiatif" stamp ---------- */
      #six {
        position: absolute;
        left: 0;
        right: 0;
        top: 210px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 26px;
        opacity: 0;
      }
      #six .ring {
        width: 230px;
        height: 230px;
        border-radius: 50%;
        background: var(--gold);
        color: var(--navy);
        font-weight: 900;
        font-size: 190px;
        line-height: 230px;
        text-align: center;
        letter-spacing: -0.04em;
      }
      #six .lbl {
        font-weight: 900;
        font-size: 84px;
        line-height: 0.95;
        letter-spacing: -0.03em;
        text-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      }

      /* ---------- wipe ---------- */
      .wipe {
        position: absolute;
        top: -200px;
        bottom: -200px;
        left: 0;
        width: 1400px;
        background: linear-gradient(90deg, rgba(255, 198, 41, 0) 0%, var(--gold) 30%, var(--gold) 70%, rgba(255, 198, 41, 0) 100%);
        transform: rotate(14deg);
        opacity: 0;
        z-index: 30;
      }

      /* ---------- recap + outro ---------- */
      #recap {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 130px;
        background: var(--navy-90);
        border-radius: 28px;
        padding: 30px 36px 26px;
        opacity: 0;
      }
      #recap h3 {
        font-weight: 900;
        font-size: 50px;
        letter-spacing: -0.02em;
        margin-bottom: 14px;
        color: var(--gold);
      }
      .rline {
        display: flex;
        align-items: center;
        gap: 18px;
        font-weight: 700;
        font-size: 36px;
        padding: 8px 0;
        opacity: 0;
      }
      .rline .tick {
        flex: none;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--gold);
        color: var(--navy);
        font-weight: 900;
        font-size: 30px;
        line-height: 46px;
        text-align: center;
      }
      #quote {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 200px;
        text-align: center;
        opacity: 0;
      }
      #quote .q {
        display: block;
        font-family: "League Gothic", sans-serif;
        font-size: 150px;
        line-height: 0.95;
        color: var(--gold);
        text-transform: uppercase;
        text-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      #quote2 {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 220px;
        text-align: center;
        opacity: 0;
      }
      #quote2 .m {
        display: block;
        font-weight: 900;
        font-size: 104px;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      #quote2 .m b {
        color: var(--gold);
      }
      #quote2 .s {
        display: inline-block;
        margin-top: 18px;
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: 0.06em;
        background: var(--navy-90);
        padding: 10px 24px;
        border-radius: 12px;
      }
      #cta {
        position: absolute;
        left: 0;
        right: 0;
        top: 260px;
        display: flex;
        justify-content: center;
        gap: 28px;
      }
      .btn {
        display: flex;
        align-items: center;
        gap: 16px;
        font-weight: 900;
        font-size: 56px;
        padding: 22px 42px;
        border-radius: 999px;
        opacity: 0;
      }
      .btn svg {
        display: block;
        width: 56px;
        height: 56px;
      }
      #btn-like {
        background: var(--gold);
        color: var(--navy);
      }
      #btn-share {
        background: var(--red);
        color: #fff;
      }

      /* ---------- captions ---------- */
      #captions {
        position: absolute;
        left: 0;
        right: 0;
        top: 1330px;
        height: 260px;
        z-index: 20;
      }
      .cg {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 0;
        text-align: center;
        font-weight: 900;
        font-size: 84px;
        line-height: 1.08;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        opacity: 0;
        visibility: hidden;
        text-shadow:
          0 6px 0 rgba(4, 14, 30, 0.85),
          0 0 28px rgba(4, 14, 30, 0.6);
      }
      .cw {
        display: inline-block;
        margin: 0 0.12em;
        opacity: 0.5;
      }
      .cw.acc {
        color: var(--gold);
      }
    </style>
