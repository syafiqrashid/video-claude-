<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Bil Elektrik 800 kWj</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --navy: #0e1b3d;
        --navy2: #16285a;
        --cream: #fff8e7;
        --yellow: #ffd23f;
        --green: #3ddc84;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--navy); }
      #stage {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        font-family: Montserrat, sans-serif; color: var(--cream);
      }
      #cam { position: absolute; inset: 0; transform-origin: 50% 28%; }
      .vid { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(180deg, rgba(14,27,61,0.55) 0%, rgba(14,27,61,0) 16%, rgba(14,27,61,0) 60%, rgba(14,27,61,0.6) 100%);
      }
      #flash { position: absolute; inset: 0; background: var(--cream); opacity: 0; }
      #progwrap { position: absolute; left: 0; top: 0; width: 1080px; height: 10px; background: rgba(14,27,61,0.5); }
      #prog { width: 100%; height: 100%; background: var(--yellow); transform-origin: 0 50%; }

      </style>
  </head>
  <body>
    <div data-hf-id="hf-6hrj" id="stage" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
      <div data-hf-id="hf-hlzi" id="cam">
{{VIDEOS}}
      </div>
      <div data-hf-id="hf-h7i3" id="vignette"></div>
      <div data-hf-id="hf-hmg5" id="flash"></div>
      <div data-hf-id="hf-70bz" id="gfx" data-composition-id="gfx" data-composition-src="compositions/gfx.html" data-start="0" data-duration="{{TOTAL}}" data-track-index="3" data-width="1080" data-height="1920"></div>
      <div data-hf-id="hf-a07v" id="caps" data-composition-id="caps" data-composition-src="compositions/caps.html" data-start="0" data-duration="{{TOTAL}}" data-track-index="5" data-width="1080" data-height="1920"></div>
      <div data-hf-id="hf-1g6x" id="progwrap"><div data-hf-id="hf-bsq9" id="prog"></div></div>
{{SFX}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
{{JS}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
